<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Josephine Ama Gyasi · Software Engineer</title>
    <meta
      name="description"
      content="Josephine Ama Gyasi, MSc Software Engineering student at JUNIA ISEN, Lille. Full-stack apps and computer-vision tools."
    />
    <meta name="theme-color" content="#24221E" />

    <!-- Set light/dark theme before first paint (no flash). Saved choice wins, else the OS setting. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>

    <!-- Fonts: Archivo (variable width + weight) and JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- Hero photo is above the fold: preload it. Keep `imagesizes` in sync with SIZES in src/components/Hero/Hero.jsx -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/images/hero/josephine-640.avif 640w, /images/hero/josephine-960.avif 960w, /images/hero/josephine-1280.avif 1280w, /images/hero/josephine-1920.avif 1920w"
      imagesizes="(min-width: 900px) 62vw, 85vh"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
